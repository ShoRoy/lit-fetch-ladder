name: protected paths

# Fails a pull request that changes a frozen path (.github/protected-paths.txt). It runs as
# pull_request_target, so the list and this check always come from main and a pull request
# cannot edit them away. It never checks out or runs code from the pull request: it reads the
# changed file names from the API, with read-only permissions.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    # The maintainer's own pull requests are not checked.
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Fail if a frozen path is changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' \
            | bash .github/check-protected.sh | tee -a "$GITHUB_STEP_SUMMARY"
