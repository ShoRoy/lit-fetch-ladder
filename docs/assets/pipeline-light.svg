<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="440" viewBox="0 0 1060 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">How lit-fetch-ladder works</title>
<desc id="desc">A request (a topic, DOIs or a paper's references) climbs four rungs: find and rank papers, an open-access copy, a browser without a login, a browser with your library login. Claude Code hooks guard the last rung. Every file is checked against its paper, recorded in a manifest, and can be filed into Zotero through Zotero MCP, a separate project the plugin can install.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<rect x="8" y="34" width="800" height="392" rx="14" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="24" y="24" font-size="15"><tspan fill="#1f2328" font-weight="700">lit-fetch-ladder</tspan><tspan fill="#59636e" font-size="13" dx="10">this repository</tspan></text>
<rect x="138" y="56" width="404" height="88" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.2"/>
<text x="244" y="76" fill="#0550ae" font-size="12.5" font-weight="700" font-style="normal" text-anchor="start">Guard: Claude Code hooks</text>
<text x="244" y="92" fill="#0550ae" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">you approve each batch; page loads are capped</text>
<line x1="180" y1="100" x2="180" y2="384" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
<line x1="228" y1="100" x2="228" y2="384" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
<line x1="180" y1="118" x2="228" y2="118" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
<text x="246" y="116" fill="#b45309" font-size="15" font-weight="700" font-style="normal" text-anchor="start">3</text>
<text x="262" y="116" fill="#1f2328" font-size="15" font-weight="600" font-style="normal" text-anchor="start">Browser with your library login</text>
<text x="262" y="133" fill="#59636e" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">the same browser, carrying your sign-in</text>
<line x1="180" y1="190" x2="228" y2="190" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
<text x="246" y="188" fill="#b45309" font-size="15" font-weight="700" font-style="normal" text-anchor="start">2</text>
<text x="262" y="188" fill="#1f2328" font-size="15" font-weight="600" font-style="normal" text-anchor="start">Browser, no login</text>
<text x="262" y="205" fill="#59636e" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">pages a plain script cannot read</text>
<line x1="180" y1="262" x2="228" y2="262" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
<text x="246" y="260" fill="#b45309" font-size="15" font-weight="700" font-style="normal" text-anchor="start">1</text>
<text x="262" y="260" fill="#1f2328" font-size="15" font-weight="600" font-style="normal" text-anchor="start">Open-access copy</text>
<text x="262" y="277" fill="#59636e" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">Unpaywall and OpenAlex, legal copies only</text>
<line x1="180" y1="334" x2="228" y2="334" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
<text x="246" y="332" fill="#b45309" font-size="15" font-weight="700" font-style="normal" text-anchor="start">0</text>
<text x="262" y="332" fill="#1f2328" font-size="15" font-weight="600" font-style="normal" text-anchor="start">Find and rank papers</text>
<text x="262" y="349" fill="#59636e" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">OpenAlex: a topic, or a paper's references</text>
<line x1="156" y1="322" x2="156" y2="128" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrL)"/>
<text x="194" y="410" fill="#59636e" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle">each paper climbs only as far as it needs</text>
<text x="22" y="327" fill="#1f2328" font-size="14" font-weight="600" font-style="normal" text-anchor="start">A topic,</text>
<text x="22" y="344" fill="#1f2328" font-size="14" font-weight="600" font-style="normal" text-anchor="start">DOIs, or a</text>
<text x="22" y="361" fill="#1f2328" font-size="14" font-weight="600" font-style="normal" text-anchor="start">paper's</text>
<text x="22" y="378" fill="#1f2328" font-size="14" font-weight="600" font-style="normal" text-anchor="start">references</text>
<line x1="116" y1="352" x2="170" y2="352" stroke="#8c959f" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="548" y1="118" x2="560" y2="118" stroke="#8c959f" stroke-width="1.6"/>
<line x1="548" y1="190" x2="560" y2="190" stroke="#8c959f" stroke-width="1.6"/>
<line x1="548" y1="262" x2="560" y2="262" stroke="#8c959f" stroke-width="1.6"/>
<line x1="560" y1="118" x2="560" y2="262" stroke="#8c959f" stroke-width="1.6"/>
<line x1="560" y1="190" x2="574" y2="190" stroke="#8c959f" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="576" y="160" width="212" height="60" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
<text x="682.0" y="182" fill="#1f2328" font-size="14" font-weight="600" font-style="normal" text-anchor="middle">Check the file</text>
<text x="682.0" y="200" fill="#59636e" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">title and first author</text>
<line x1="682" y1="220" x2="682" y2="246" stroke="#8c959f" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="576" y="248" width="212" height="60" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
<text x="682.0" y="270" fill="#1f2328" font-size="14" font-weight="600" font-style="normal" text-anchor="middle">Manifest</text>
<text x="682.0" y="288" fill="#59636e" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">one recorded outcome per paper</text>
<line x1="682" y1="308" x2="682" y2="334" stroke="#8c959f" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="576" y="336" width="212" height="60" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
<text x="682.0" y="358" fill="#1f2328" font-size="14" font-weight="600" font-style="normal" text-anchor="middle">File into Zotero</text>
<text x="682.0" y="376" fill="#59636e" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">optional; can install Zotero MCP</text>
<line x1="788" y1="366" x2="856" y2="366" stroke="#cc2936" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="822" y="356" fill="#59636e" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle">bridge</text>
<text x="954" y="300" fill="#59636e" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">outside this repository</text>
<rect x="858" y="312" width="192" height="108" rx="9" fill="#f6f8fa" stroke="#cc2936" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="954.0" y="334" fill="#1f2328" font-size="14" font-weight="600" font-style="normal" text-anchor="middle">Zotero MCP</text>
<text x="954.0" y="352" fill="#59636e" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">separate project</text>
<text x="954.0" y="368" fill="#59636e" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">search, read, cite and</text>
<text x="954.0" y="384" fill="#59636e" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">annotate your library</text>
<text x="954.0" y="400" fill="#59636e" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">from any agent</text>
<g transform="translate(876 316) scale(0.1719)"><g transform="translate(4 9) scale(.94)" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M40 12H88a26 26 0 0 1 26 26V78a26 26 0 0 1-26 26H62L38 118V104H40a26 26 0 0 1-26-26V38a26 26 0 0 1 26-26Z" stroke="#1a1a1a" stroke-width="5.5"/><path d="M47 39H81L47 77H81" stroke="#cc2936" stroke-width="8"/></g></g>
</svg>
